name: TripStack Capstone CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke UI suite
        env:
          TRIPSTACK_EMAIL: rupert@tripstack.test
          TRIPSTACK_PASSWORD: Password@123
          PLAYWRIGHT_BASE_URL: https://tripstack.doomple.com
        run: npm run test:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            allure-results

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run API contract smoke
        env:
          PLAYWRIGHT_BASE_URL: https://tripstack.doomple.com
        run: npm run api:contract
      - name: Run perf gate script
        run: npm run perf:check
