name: TripStack CI

on:
  push:
    branches:
      - vikram-final-capstone

  pull_request:
    branches:
      - vikram-final-capstone

  workflow_dispatch:

permissions:
  contents: write

env:
  TRIPSTACK_BASE_URL: https://tripstack.doomple.com
  TRIPSTACK_EMAIL: ${{ secrets.TRIPSTACK_EMAIL }}
  TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}

jobs:

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: APITesting

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run API Tests
        continue-on-error: true
        run: mvn clean test

      - name: Upload API Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: APITesting/target/allure-results
          if-no-files-found: warn

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playwrightUI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: playwrightUI/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        continue-on-error: true
        env:
          CI: true
        run: |
          npx playwright test

      - name: Upload UI Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: playwrightUI/allure-results
          if-no-files-found: warn

  allure-report:
    name: Generate & Publish Allure Report

    needs:
      - api-tests
      - ui-tests

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download API Results
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: allure-results

      - name: Download UI Results
        uses: actions/download-artifact@v4
        with:
          name: ui-allure-results
          path: ui-results

      - name: Merge Allure Results
        run: |
          cp -R ui-results/. allure-results/ || true

      - name: Checkout gh-pages
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history
          gh_pages: gh-pages

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: allure-history
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report Link
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          URL="https://${OWNER}.github.io/${REPO}/"

          echo "✅ TripStack CI Completed"
          echo "📊 Allure Report: ${URL}"
          echo "📊 [Open Allure Report](${URL})" >> $GITHUB_STEP_SUMMARY