name: TripStack Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Playwright_Final_Capstone
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Playwright_Final_Capstone/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui
        env:
          BASE_URL: ${{ vars.TRIPSTACK_BASE_URL || 'https://tripstack.doomple.com/' }}
          HEADLESS: 'true'
          TRIPSTACK_EMAIL: ${{ secrets.TRIPSTACK_EMAIL }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
          SEAT_MAP_MAX_RENDER_MS: ${{ vars.SEAT_MAP_MAX_RENDER_MS || '5000' }}

      - name: Upload UI reports and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: |
            Playwright_Final_Capstone/artifacts/html-report/
            Playwright_Final_Capstone/artifacts/junit/results.xml
            Playwright_Final_Capstone/artifacts/test-results/
          if-no-files-found: warn
          retention-days: 30

  api-tests:
    name: API tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: API_Testing_Finalcapstone
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: API_Testing_Finalcapstone/pom.xml

      - name: Run API tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload API test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: |
            API_Testing_Finalcapstone/target/surefire-reports/
            API_Testing_Finalcapstone/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30
