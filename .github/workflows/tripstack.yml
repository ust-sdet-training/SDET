name: Travel Stack CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:

  api-tests:

    name: API Automation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack_db
        ports:
          - 3306:3306

    defaults:
      run:
        working-directory: API-week7_gate7

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Build API Project
        run: mvn clean compile

      - name: Run API Tests
        run: mvn test

      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: API-week7_gate7/target/surefire-reports

  database-tests:

    name: Database Validation
    runs-on: ubuntu-latest

    needs: api-tests

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack_db
        ports:
          - 3306:3306

    defaults:
      run:
        working-directory: API-week7_gate7

