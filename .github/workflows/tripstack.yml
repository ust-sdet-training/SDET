name: Travel Booking Automation CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:

  api-tests:

    name: API Automation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack_db
        ports:
          - 3306:3306

    defaults:
      run:
        working-directory: API-week7_gate7

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Build API Project
        run: mvn clean compile

      - name: Run API Tests
        run: mvn test

      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: API-week7_gate7/target/surefire-reports

  database-tests:

    name: Database Validation
    runs-on: ubuntu-latest

    needs: api-tests

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack_db
        ports:
          - 3306:3306

    defaults:
      run:
        working-directory: API-week7_gate7

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Execute Database Validation
        run: mvn -Dtest=ApiTesting test

      - name: Upload Database Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-reports
          path: API-week7_gate7/target/surefire-reports

  ui-tests:

    name: Playwright UI Automation
    runs-on: ubuntu-latest

    needs: api-tests

    defaults:
      run:
        working-directory: Playwright_UI

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_UI/playwright-report

  performance-tests:

    name: Performance Testing
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - ui-tests

    defaults:
      run:
        working-directory: Playwright_UI

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Performance Tests
        run: npx playwright test tests/perf.spec.ts tests/payLatency.spec.ts

      - name: Upload Performance Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: Playwright_UI/playwright-report

  publish-reports:

    name: Publish Reports
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - database-tests
      - ui-tests
      - performance-tests

    steps:

      - name: Download Reports
        uses: actions/download-artifact@v4

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-automation-report
          path: .