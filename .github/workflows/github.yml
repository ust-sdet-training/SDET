name: Travel Booking Capstone CI

on:
  push:
    branches:
      - deepak-final-capstone

  pull_request:
    branches:
      - deepak-final-capstone

  workflow_dispatch:

permissions:
  contents: write

env:
  USER_EMAIL: ${{ secrets.DEEPAK_USER_EMAIL }}
  USER_PASSWORD: ${{ secrets.DEEPAK_USER_PASSWORD }}

  BASE_URL: ${{ secrets.DEEPAK_BASE_URL }}

  USER_PHONE_NUMBER: ${{ secrets.DEEPAK_USER_PHONE_NUMBER }}
  USER_NAME_ON_CARD: ${{ secrets.DEEPAK_USER_NAME_ON_CARD }}
  USER_CARD_NUMBER: ${{ secrets.DEEPAK_USER_CARD_NUMBER }}
  USER_CARD_CVV: ${{ secrets.DEEPAK_USER_CARD_CVV }}
  USER_CARD_EXPIRY_DATE: ${{ secrets.DEEPAK_USER_CARD_EXPIRY_DATE }}

jobs:

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: API-RestAssured

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create API .env
        run: |
          cat <<EOF > .env
          USER_EMAIL=$USER_EMAIL
          USER_PASSWORD=$USER_PASSWORD
          EOF

      - name: Run API Tests
        run: mvn clean test

      - name: Debug Target Folder
        if: always()
        run: |
          pwd
          ls -R target || true
          ls -R target/allure-results || true

      - name: Copy Allure Metadata
        if: always()
        run: |
          mkdir -p target/allure-results
          cp src/test/resources/allure/categories.json target/allure-results/ || true
          cp src/test/resources/allure/environment.properties target/allure-results/ || true

      - name: Upload API Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: API-RestAssured/target/allure-results
          if-no-files-found: warn

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UI-Playwright

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI-Playwright/package-lock.json

      - name: Create UI .env
        run: |
          cat <<EOF > .env
          BASE_URL=$BASE_URL
          USER_EMAIL=$USER_EMAIL
          USER_PASSWORD=$USER_PASSWORD
          USER_PHONE_NUMBER=$USER_PHONE_NUMBER
          USER_NAME_ON_CARD=$USER_NAME_ON_CARD
          USER_CARD_NUMBER=$USER_CARD_NUMBER
          USER_CARD_CVV=$USER_CARD_CVV
          USER_CARD_EXPIRY_DATE=$USER_CARD_EXPIRY_DATE
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run UI Tests
        run: npx playwright test

      - name: Upload UI Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: UI-Playwright/allure-results
          if-no-files-found: warn

  allure-report:
    name: Generate & Publish Allure Report

    needs:
      - api-tests
      - ui-tests

    if: always()

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download API Results
        uses: actions/download-artifact@v4
        with:
          name: api-allure-results
          path: allure-results

      - name: Download UI Results
        uses: actions/download-artifact@v4
        with:
          name: ui-allure-results
          path: ui-results

      - name: Merge Allure Results
        run: |
          cp -R ui-results/. allure-results/ || true

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Debug Generated Report
        run: |
          pwd
          ls -R allure-history || true

      - name: Publish GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true