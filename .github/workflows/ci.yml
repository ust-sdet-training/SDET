name: Automation Tests

on:
  push:
    branches:
      - main
      - cipiraj_Final_Capstone
  pull_request:
    branches:
      - main
      - cipiraj_Final_Capstone

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        working-directory: ApiTesting
        run: gradle wrapper

      - name: Grant execute permission
        working-directory: ApiTesting
        run: chmod +x gradlew

      - name: Run Tests
        working-directory: ApiTesting
        run: ./gradlew test
       
        


  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: playwright
        run: npm ci

      - name: Install Browsers
        working-directory: playwright
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        working-directory: playwright
        env:
          BASE_TRIP_HEIDI_URL: ${{ secrets.BASE_TRIP_HEIDI_URL }}
          TRIPSTACK_HEIDI_PASSWORD: ${{ secrets.TRIPSTACK_HEIDI_PASSWORD }}
        run: npx playwright test ./tests/finalcapstone.spec.ts