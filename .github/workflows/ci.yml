  performance-tests:
    name: Playwright Performance Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Performance_Testing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Performance_Testing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Performance Tests
        run: npx playwright test

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-playwright-report
          path: Performance_Testing/playwright-report

      - name: Upload Performance Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: Performance_Testing/test-results