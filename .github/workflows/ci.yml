name: API & UI CI

on:
  push:
    branches:
      - Athuldev_final_Assessmetnt

  pull_request:
    branches:
      - Athuldev_final_Assessmetnt

jobs:
  api-tests:
    name: API Automation Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Api_Automation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Run API Tests
        run: mvn clean test

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: Api_Automation/target

  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Ui_Testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Ui_Testing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Ui_Testing/playwright-report

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Ui_Testing/test-results

  performance-tests:
    name: Playwright Performance Tests
    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: Performance_Testing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Performance_Testing/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Performance Tests
        run: npx playwright test

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-playwright-report
          path: Performance_Testing/playwright-report

      - name: Upload Performance Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: Performance_Testing/test-results