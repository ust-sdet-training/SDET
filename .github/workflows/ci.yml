name: TripStack Final Capstone CI

on:
  push:
    branches:
      - kavya_final_capstone

  pull_request:
    branches:
      - kavya_final_capstone

jobs:

  playwright:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: capstonePlaywright

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Report
          path: capstonePlaywright/playwright-report

      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Traces
          path: capstonePlaywright/test-results


  api:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Capstone_Api

    services:

      mysql:

        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:

      DB_URL: jdbc:mysql://127.0.0.1:3306/tripstack

      DB_USERNAME: root

      DB_PASSWORD: root

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Wait for MySQL
        run: sleep 20

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Create Database Table
        run: |
          mysql -h127.0.0.1 -uroot -proot tripstack <<EOF
          CREATE TABLE IF NOT EXISTS bookings(
              id INT AUTO_INCREMENT PRIMARY KEY,
              booking_id VARCHAR(50),
              pnr VARCHAR(50),
              passenger_name VARCHAR(100),
              status VARCHAR(30)
          );
          EOF

      - name: Run Maven Tests
        run: mvn clean test

      - name: Generate Allure Report
        if: always()
        run: mvn io.qameta.allure:allure-maven:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Report
          path: Capstone_Api/target/site/allure-maven-plugin

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maven-Test-Results
          path: Capstone_Api/target/surefire-reports