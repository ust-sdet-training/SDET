name: Gradle CI

on:
  push:
    paths:
      - 'gradleproject/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'gradleproject/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gradleproject

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run OrdersDataIT in CI
        run: ./gradlew clean test --tests 'com.example.Selenium.data.OrdersDataIT'
 