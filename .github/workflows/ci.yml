name: TripStack CI

on:
  push:
    branches: jyothsan-finalcapstone
  

jobs:
  api-tests:
    name: API + DB (RestAssured/JUnit5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        working-directory: API/APIautomation

      - name: Run API tests (functional + security)
        env:
          TRIPSTACK_EMAIL: ${{ secrets.EMP1014_TRIPSTACK_EMAIL }}
          TRIPSTACK_PASSWORD: ${{ secrets.EMP1014_TRIPSTACK_PASSWORD }}
          TRIPSTACK_EMP_ID: ${{ secrets.EMP1014_TRIPSTACK_EMP_ID }}
          TRIPSTACK_DB_URL: ${{ secrets.EMP1014_TRIPSTACK_DB_URL }}
          TRIPSTACK_DB_USER: ${{ secrets.EMP1014_TRIPSTACK_DB_USER }}
          TRIPSTACK_DB_PASS: ${{ secrets.EMP1014_TRIPSTACK_DB_PASS }}
          TRIPSTACK_OTHER_EMP_PNR: ${{ secrets.EMP1014_TRIPSTACK_OTHER_EMP_PNR }}
          TRIPSTACK_OTHER_EMP_BOOKING_ID: ${{ secrets.EMP1014_TRIPSTACK_OTHER_EMP_BOOKING_ID }}
        run: ./gradlew clean test -DexcludeTags=performance
        working-directory: API/APIautomation

      - name: Run performance gate
        env:
          TRIPSTACK_EMAIL: ${{ secrets.EMP1014_TRIPSTACK_EMAIL }}
          TRIPSTACK_PASSWORD: ${{ secrets.EMP1014_TRIPSTACK_PASSWORD }}
          TRIPSTACK_EMP_ID: ${{ secrets.EMP1014_TRIPSTACK_EMP_ID }}
        run: ./gradlew test --tests "*PerformanceTest"
        working-directory: API/APIautomation

      - name: Upload API Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-allure-results
          path: API/APIautomation/allure-results

      - name: Upload API Gradle test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gradle-test-report
          path: API/APIautomation/build/reports/tests/test

  ui-tests:
    name: UI (Playwright/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: UIAutomation/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: UIAutomation

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: UIAutomation

      - name: Run UI tests
        env:
          BASE_URL: ${{ secrets.EMP1014_UI_BASE_URL }}
          EMAIL: ${{ secrets.EMP1014_UI_EMAIL }}
          PASSWORD: ${{ secrets.EMP1014_UI_PASSWORD }}
          EMP_ID: ${{ secrets.EMP1014_UI_EMP_ID }}
        run: npx playwright test
        working-directory: UIAutomation

      - name: Upload UI Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-allure-results
          path: UIAutomation/allure-results

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UIAutomation/playwright-report

      - name: Upload Playwright traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: UIAutomation/reports/artifacts

  merge-gate:
    name: Merge Gate
    needs: [api-tests, ui-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check both jobs passed
        run: |
          if [ "${{ needs.api-tests.result }}" != "success" ] || [ "${{ needs.ui-tests.result }}" != "success" ]; then
            echo "One or both test jobs failed. Blocking merge."
            exit 1
          fi
          echo "Both API and UI jobs passed."