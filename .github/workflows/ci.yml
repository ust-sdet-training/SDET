name: TripStack API + UI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Run API smoke tests
        working-directory: api
        env:
          TRIPSTACK_BASE_URL: https://tripstack.doomple.com
          TRIPSTACK_EMAIL: rupert@tripstack.test
          TRIPSTACK_PASSWORD: Password@123
        run: mvn -q -Dtest=AuthTest,SecurityNegativeTest test

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke suite
        working-directory: ui
        env:
          TRIPSTACK_EMAIL: rupert@tripstack.test
          TRIPSTACK_PASSWORD: Password@123
          PLAYWRIGHT_BASE_URL: https://tripstack.doomple.com
        run: npm run test:ci

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            ui/playwright-report
            ui/test-results
