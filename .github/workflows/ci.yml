name: Gradle CI

on:
  push:
    paths:
      - 'gradleproject/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'gradleproject/**'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gradleproject

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Run OrdersDataIT in CI
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
        run: ./gradlew --no-daemon clean test --tests 'com.example.Selenium.data.OrdersDataIT'
 