name: Travel Booking Automation

on:
  push:
    branches:
      - Saiteja_Final_Capstone

  pull_request:
    branches:
      - Saiteja_Final_Capstone

  workflow_dispatch:

jobs:

  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Playwright_UI_Testing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.TRIPSTACK_USERNAME }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
        run: npx playwright test busBooking.spec.ts

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_UI_Testing/playwright-report
          if-no-files-found: warn

  api-db-tests:
    name: API & Database Tests
    runs-on: ubuntu-latest
    needs: ui-tests

    defaults:
      run:
        working-directory: API_DB_Testing

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_booking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('API_DB_Testing/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Initialize Database Schema
        run: |
          mysql -h 127.0.0.1 \
                -u root \
                -proot \
                travel_booking < src/test/resources/schema.sql

      - name: Seed Database
        run: |
          mysql -h 127.0.0.1 \
                -u root \
                -proot \
                travel_booking < src/test/resources/seed.sql

      - name: Verify Seed Data
        run: |
          mysql -h 127.0.0.1 \
                -u root \
                -proot \
                -e "USE travel_booking; SELECT * FROM bookings; SELECT * FROM passengers; SELECT * FROM payments;"

      - name: Run API & Database Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.TRIPSTACK_USERNAME }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
          DB_URL: jdbc:mysql://127.0.0.1:3306/travel_booking
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API_DB_Testing/allure-results
          if-no-files-found: warn

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: api-db-tests

    defaults:
      run:
        working-directory: Performance

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run Performance Tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.TRIPSTACK_USERNAME }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
        run: |
          k6 run scripts/search.js --summary-export=summary.json

      - name: Upload k6 Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary
          path: Performance/summary.json
          if-no-files-found: warn

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: performance-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.BASE_URL }}
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html
          if-no-files-found: warn