name: TripStack Final Capstone CI

on:
  push:
    branches:
      - kavya_final_capstone

  pull_request:
    branches:
      - kavya_final_capstone

jobs:

  playwright:

    name: Playwright UI Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: capstonePlaywright

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capstonePlaywright/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          CI: true
        run: |
          npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-HTML-Report
          path: capstonePlaywright/playwright-report

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Playwright-Test-Results
          path: capstonePlaywright/test-results

  api:

    name: API Automation Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Capstone_Api

    services:

      mysql:

        image: mysql:8.4

        ports:
          - 3306:3306

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:

      DB_URL: jdbc:mysql://127.0.0.1:3306/tripstack
      DB_USERNAME: root
      DB_PASSWORD: root

      TRIPSTACK_BASE_URL: ${{ secrets.TRIPSTACK_BASE_URL }}
      TRIPSTACK_LOGIN_EMAIL: ${{ secrets.TRIPSTACK_LOGIN_EMAIL }}
      TRIPSTACK_LOGIN_PASSWORD: ${{ secrets.TRIPSTACK_LOGIN_PASSWORD }}

      TRIPSTACK_FROM: DEL
      TRIPSTACK_TO: IXC
      TRIPSTACK_BUS_CODE: BUS-DELIXC-01
      TRIPSTACK_SEAT: L3

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22
          cache: maven

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent
          do
            echo "Waiting for MySQL..."
            sleep 3
          done

      - name: Create Database Table
        run: |
          mysql -h127.0.0.1 -uroot -proot tripstack <<EOF
          CREATE TABLE IF NOT EXISTS bookings (
            id INT AUTO_INCREMENT PRIMARY KEY,
            booking_id VARCHAR(50),
            pnr VARCHAR(50),
            passenger_name VARCHAR(100),
            status VARCHAR(30)
          );
          EOF

      - name: Run Maven Tests
        run: mvn -B clean test

      - name: Generate Allure Report
        if: always()
        run: mvn -B io.qameta.allure:allure-maven:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Allure-Report
          path: Capstone_Api/target/site/allure-maven-plugin

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maven-Test-Results
          path: Capstone_Api/target/surefire-reports