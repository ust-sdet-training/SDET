name: Travel Booking Automation

on:
  push:
    branches:
      - Monisha_Final_Capstone

  pull_request:
    branches:
      - Monisha_Final_Capstone

  workflow_dispatch:

jobs:

  ui-tests:
    name: UI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.Monisha_BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.MonishaTripstickUsername }}
          TRIPSTACK_PASSWORD: ${{ secrets.MonishaTripstackPassword }}
        run: npx playwright test

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UI/playwright-report
          if-no-files-found: warn

  api-db-tests:
    name: API & Database Tests
    runs-on: ubuntu-latest
    needs: ui-tests

    defaults:
      run:
        working-directory: API-M

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Run API & Database Tests
        env:
          BASE_URL: ${{ secrets.Monisha_BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.MonishaTripstickUsername }}
          TRIPSTACK_PASSWORD: ${{ secrets.MonishaTripstackPassword }}
        run: mvn clean test

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: API-M/target/surefire-reports
          if-no-files-found: warn

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API-M/allure-results
          if-no-files-found: warn
