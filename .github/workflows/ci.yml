name: CI for UI and API Automation

on:
  push:
    branches:
      - shahbaz-final-capstone
      - main
  pull_request:
    branches:
      - shahbaz-final-capstone
      - main

jobs:
  ui-tests:
    name: UI Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: UIAutomation

    env:
      CI: true
      BASEURL: ${{ vars.BASEURL || 'https://tripstack.doomple.com/' }}
      CUSTOMER_EMAIL: ${{ secrets.SHAHBAZ_CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.SHAHBAZ_CUSTOMER_PASSWORD }}
      PASSENGER_FIRST_NAME: ${{ vars.PASSENGER_FIRST_NAME || 'Test' }}
      PASSENGER_LAST_NAME: ${{ vars.PASSENGER_LAST_NAME || 'User' }}
      PASSENGER_AGE: ${{ vars.PASSENGER_AGE || '30' }}
      PASSENGER_GENDER: ${{ vars.PASSENGER_GENDER || 'male' }}
      PASSENGER_EMAIL: ${{ secrets.SHAHBAZ_PASSENGER_EMAIL || 'test@example.com' }}
      PASSENGER_PHONE: ${{ secrets.SHAHBAZ_PASSENGER_PHONE || '1234567890' }}
      CARD_NAME_ON_CARD: ${{ secrets.SHAHBAZ_CARD_NAME_ON_CARD || 'Test User' }}
      CARD_NUMBER: ${{ secrets.SHAHBAZ_CARD_NUMBER || '4111111111111111' }}
      CARD_EXPIRY: ${{ secrets.SHAHBAZ_CARD_EXPIRY || '12/30' }}
      CARD_CVV: ${{ secrets.SHAHBAZ_CARD_CVV || '123' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UIAutomation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UIAutomation/playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: UIAutomation/test-results/
          if-no-files-found: warn

  api-tests:
    name: API Maven Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: APIAutomationFinal

    env:
      CI: true
      BASEURL: ${{ vars.BASEURL || 'https://tripstack.doomple.com/' }}
      CUSTOMER_EMAIL: ${{ secrets.SHAHBAZ_CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ secrets.SHAHBAZ_CUSTOMER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Run Maven tests
        run: mvn -B test

      - name: Upload Maven reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-maven-reports
          path: |
            APIAutomationFinal/target/surefire-reports/
            APIAutomationFinal/target/site/
          if-no-files-found: warn