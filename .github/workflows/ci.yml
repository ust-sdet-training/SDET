name: CI for UI and API Automation

on:
  push:
    branches:
      - shahbaz-final-capstone
  pull_request:
    branches:
      - shahbaz-final-capstone

jobs:
  ui-tests:
    name: UI Automation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ vars.CUSTOMER_EMAIL != '' && vars.CUSTOMER_PASSWORD != '' }}

    defaults:
      run:
        working-directory: UIAutomation

    env:
      CI: true
      BASEURL: https://tripstack.doomple.com/
      CUSTOMER_EMAIL: ${{ vars.CUSTOMER_EMAIL }}
      CUSTOMER_PASSWORD: ${{ vars.CUSTOMER_PASSWORD }}
      PASSENGER_FIRST_NAME: ${{ vars.PASSENGER_FIRST_NAME || 'Test' }}
      PASSENGER_LAST_NAME: ${{ vars.PASSENGER_LAST_NAME || 'User' }}
      PASSENGER_AGE: ${{ vars.PASSENGER_AGE || '30' }}
      PASSENGER_GENDER: ${{ vars.PASSENGER_GENDER || 'male' }}
      PASSENGER_EMAIL: ${{ vars.PASSENGER_EMAIL || 'test@example.com' }}
      PASSENGER_PHONE: ${{ vars.PASSENGER_PHONE || '1234567890' }}
      CARD_NAME_ON_CARD: ${{ vars.CARD_NAME_ON_CARD || 'Test User' }}
      CARD_NUMBER: ${{ vars.CARD_NUMBER || '4111111111111111' }}
      CARD_EXPIRY: ${{ vars.CARD_EXPIRY || '12/30' }}
      CARD_CVV: ${{ vars.CARD_CVV || '123' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: UIAutomation/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UIAutomation/playwright-report/
          if-no-files-found: warn

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: UIAutomation/test-results/
          if-no-files-found: warn

  performance-tests:
    name: Performance Tests (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: UIAutomation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Verify k6 Installation
        run: k6 version

      - name: Run k6 Performance Test
        run: |
          k6 run performance/checkout-load.js

  api-tests:
    name: API Automation Tests with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: gradle

      - name: Grant execute permission for Gradle wrapper
        working-directory: APIAutomationFinal
        run: chmod +x gradlew

      - name: Run API tests
        working-directory: APIAutomationFinal
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            APIAutomationFinal/build/reports/
            APIAutomationFinal/build/test-results/
          if-no-files-found: warn