name: ci

on:
  push:
    branches: [V2]
  pull_request:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [journey, negative, resilience]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui-tests
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: ui-tests
      - name: Run UI suite
        run: npx playwright test --grep "@${{ matrix.suite }}"
        working-directory: ui-tests
      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-${{ matrix.suite }}
          path: |
            ui-tests/test-results
            ui-tests/artifacts
            ui-tests/allure-results

  api-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      EMPLOYEE_ID: E12
      DB_URL: jdbc:mysql://127.0.0.1:3306/tripstack
      DB_USER: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create bookings table
        run: |
          mysql -h 127.0.0.1 -u root -proot tripstack -e \
          "CREATE TABLE IF NOT EXISTS bookings (id INT PRIMARY KEY AUTO_INCREMENT, employee_id VARCHAR(20), route VARCHAR(20), status VARCHAR(20));"
      - run: mvn test -Dgroups=journey,security,db
        working-directory: api-tests
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: api-tests/target/surefire-reports

  performance:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 checkout performance test
        run: |
          mkdir -p perf/k6/results
          k6 run perf/k6/checkout.js \
            --summary-export=perf/k6/results/summary.json

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: perf/k6/results

  quality-gate:
    runs-on: ubuntu-latest
    needs: [ui-tests, api-tests, performance]
    steps:
      - run: echo 'Quality gate passed'
