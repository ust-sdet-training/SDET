name: Travel Booking Automation

on:
  push:
    branches: [bhumika_final]
  pull_request:
    branches: [bhumika_final]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Bhumika_Capstone/Playwright_UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright UI Tests
        env:
          BASE_URL: https://tripstack.doomple.com
          TRIPSTACK_USERNAME: erin@tripstack.test
          TRIPSTACK_PASSWORD: Password@123
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Bhumika_Capstone/Playwright_UI/playwright-report
          if-no-files-found: warn

  api-db-tests:
    name: API & Database Tests
    needs: ui-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Bhumika_Capstone/api-bh

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_booking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('Bhumika_Capstone/api-bh/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -proot; do sleep 5; done

      - name: Run API & Database Tests
        env:
          BASE_URL: https://tripstack.doomple.com
          TRIPSTACK_USERNAME: erin@tripstack.test
          TRIPSTACK_PASSWORD: Password@123
          DB_URL: jdbc:mysql://127.0.0.1:3306/travel_booking
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn clean test

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: Bhumika_Capstone/api-bh/allure-results
          if-no-files-found: warn

  performance-tests:
    name: Performance Tests
    needs: api-db-tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Bhumika_Capstone/Playwright_UI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Performance Tests
        env:
          BASE_URL: https://tripstack.doomple.com
          TRIPSTACK_USERNAME: erin@tripstack.test
          TRIPSTACK_PASSWORD: Password@123
        run: npx playwright test tests/performance.spec.ts

      - name: Upload Performance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: Bhumika_Capstone/Playwright_UI/test-results
          if-no-files-found: warn

  security-tests:
    name: Security Tests
    needs: performance-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://tripstack.doomple.com
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report.html
          if-no-files-found: warn