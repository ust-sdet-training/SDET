name: TripStack UI Quality Gates
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  ui-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run E07 UI journey and performance gate
      run: npm run test:ui
      env:
        BASE_URL: ${{ vars.TRIPSTACK_BASE_URL }}
        TRIPSTACK_EMAIL: ${{ secrets.TRIPSTACK_EMAIL }}
        TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
        PASSENGER_FIRST_NAME: ${{ secrets.PASSENGER_FIRST_NAME }}
        PASSENGER_LAST_NAME: ${{ secrets.PASSENGER_LAST_NAME }}
        PASSENGER_AGE: ${{ secrets.PASSENGER_AGE }}
        PASSENGER_EMAIL: ${{ secrets.PASSENGER_EMAIL }}
        PASSENGER_PHONE: ${{ secrets.PASSENGER_PHONE }}
        PAYMENT_NAME: ${{ secrets.PAYMENT_NAME }}
        PAYMENT_NUMBER: ${{ secrets.PAYMENT_NUMBER }}
        PAYMENT_EXPIRY: ${{ secrets.PAYMENT_EXPIRY }}
        PAYMENT_CVV: ${{ secrets.PAYMENT_CVV }}
        SEAT_MAP_MAX_RENDER_MS: ${{ vars.SEAT_MAP_MAX_RENDER_MS }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-test-results
        path: test-results/
        retention-days: 30
  quality:
    name: Type safety and secret-free repository gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - run: npm ci
    - name: Verify TypeScript
      run: npm run typecheck
    - name: Verify no local secret file is tracked
      run: git ls-files --error-unmatch .env && exit 1 || exit 0
  secret-scan:
    name: Secret scan gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Detect committed secrets
      uses: gitleaks/gitleaks-action@v2
