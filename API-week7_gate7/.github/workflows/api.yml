name: API CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:

  api-tests:

    name: API Automation
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack_db
        ports:
          - 3306:3306

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}

      - name: Build Project
        run: mvn clean compile

      - name: Run API Tests
        run: mvn -Dtest=ApiTesting test

      - name: Upload API Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: target/surefire-reports

  database-tests:

    name: Database Validation
    runs-on: ubuntu-latest

    needs: api-tests

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tripstack_db
        ports:
          - 3306:3306

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Execute Database Validation
        run: mvn -Dtest=ApiTesting test

      - name: Upload Database Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-reports
          path: target/surefire-reports

  security-tests:

    name: Security Testing
    runs-on: ubuntu-latest

    needs: api-tests

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Run Security Tests
        run: mvn -Dtest=SecurityTests test

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: target/surefire-reports

  publish-reports:

    name: Publish Reports
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - database-tests
      - security-tests

    steps:

      - name: Download Reports
        uses: actions/download-artifact@v4

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-automation-report
          path: .