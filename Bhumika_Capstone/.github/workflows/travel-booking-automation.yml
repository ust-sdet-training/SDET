name: Travel Booking Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ui-tests:
    name: Playwright UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright_UI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright UI tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.TRIPSTACK_USERNAME }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_UI/playwright-report
          if-no-files-found: warn

  api-db-tests:
    name: API & Database Tests
    needs: ui-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-bh
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: travel_booking
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('api-bh/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL readiness
        run: |
          until mysqladmin ping -h 127.0.0.1 -proot; do sleep 5; done

      - name: Run API & database tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.TRIPSTACK_USERNAME }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
          DB_URL: jdbc:mysql://127.0.0.1:3306/travel_booking
          DB_USERNAME: root
          DB_PASSWORD: root
        run: mvn clean test

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: api-bh/allure-results
          if-no-files-found: warn

  performance-tests:
    name: Performance Tests
    needs: api-db-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Playwright_UI
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run performance test spec
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TRIPSTACK_USERNAME: ${{ secrets.TRIPSTACK_USERNAME }}
          TRIPSTACK_PASSWORD: ${{ secrets.TRIPSTACK_PASSWORD }}
        run: npx playwright test tests/performance.spec.ts

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: Playwright_UI/test-results
          if-no-files-found: warn

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: performance-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.BASE_URL }}
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report.html
          if-no-files-found: warn
